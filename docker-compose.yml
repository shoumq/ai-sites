services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ai_sites
      POSTGRES_PASSWORD: ai_sites
      POSTGRES_DB: ai_sites
    ports:
      # host 5433 → avoids clashing with a Postgres already running on the host's 5432.
      # Internal container-to-container traffic still uses postgres:5432 (see DATABASE_URL below).
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_sites"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Оборачивает site-renderer (Nuxt-сборка блоков из site-blocks) в HTTP API:
  # принимает SiteSchema от backend, гоняет `nuxi generate`, кладёт статику в
  # общий volume builds_data. Собирается из корня репо (нужны оба каталога
  # site-builder/ и site-renderer/ в build-контексте — см. site-builder/Dockerfile).
  site-builder:
    build:
      context: .
      dockerfile: site-builder/Dockerfile
    environment:
      BUILDS_DIR: /builds
    ports:
      - "4000:4000"
    volumes:
      - builds_data:/builds
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://ai_sites:ai_sites@postgres:5432/ai_sites
      REDIS_URL: redis://redis:6379/0
      SITE_BUILDER_URL: http://site-builder:4000
      SITE_BUILDS_DIR: /builds
      PUBLIC_BACKEND_URL: http://localhost:8000
      GENERATED_MEDIA_DIR: /generated-media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      site-builder:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
      # Тот же build-каталог, что site-builder заполняет — backend читает готовые
      # файлы отсюда для (mock-)заливки в S3, зип-экспорта и раздачи /preview-sites.
      - builds_data:/builds:ro
      # Куда StorageClient в mock-режиме S3 реально сохраняет байты (например,
      # сгенерированные YandexART-картинки) — раздаётся на /media (см. main.py).
      - generated_media_data:/generated-media

  admin-panel:
    build:
      context: .
      dockerfile: admin-panel/Dockerfile
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8000/api/v1
      NUXT_PUBLIC_WS_BASE: ws://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./admin-panel:/app
      # nuxt.config.ts делает extends: ['../site-blocks'] — layer должен лежать
      # соседом /app (см. комментарий в admin-panel/Dockerfile).
      - ./site-blocks:/site-blocks
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
  builds_data:
  generated_media_data:
